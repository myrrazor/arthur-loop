<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arthur Loop social card</title>
  <link rel="icon" href="../../site/favicon.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0a0d0b; color: #edf7ef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: 100%; height: 100%; padding: 58px 64px; display: grid; grid-template-columns: 0.88fr 1.12fr; gap: 58px; align-items: center; border: 1px solid #2a362e; }
    .wordmark { width: 360px; display: block; }
    h1 { margin: 44px 0 0; max-width: 10ch; font-size: 58px; line-height: 1.02; letter-spacing: -0.04em; }
    h1 span { color: #a3b2a7; }
    .url { margin: 42px 0 0; color: #55e878; font: 22px/1.4 ui-monospace, "SF Mono", Menlo, monospace; }
    .capture { position: relative; overflow: hidden; height: 456px; border: 1px solid #2a362e; background: #0d1114; }
    .capture img { position: absolute; top: 0; left: 0; width: 730px; max-width: none; height: auto; }
    .label { position: absolute; right: 16px; bottom: 16px; padding: 8px 10px; background: #0a0d0b; border: 1px solid #2a362e; color: #a3b2a7; font: 14px/1.2 ui-monospace, "SF Mono", Menlo, monospace; }
  </style>
</head>
<body>
  <main>
    <div>
      <img class="wordmark" src="../../assets/arthur-loop-wordmark.svg" alt="Arthur Loop" />
      <h1>AI dev loops, <span>held to a written contract.</span></h1>
      <p class="url">github.com/myrrazor/arthur-loop</p>
    </div>
    <div class="capture">
      <img src="web-console.png" alt="Arthur Loop web console" />
      <span class="label">LOCALHOST · REAL DEMO STATE</span>
    </div>
  </main>
</body>
</html>
