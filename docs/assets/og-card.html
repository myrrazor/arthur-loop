<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arthur Loop social card</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #070a08; color: #edf7ef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: 100%; height: 100%; padding: 52px 56px; display: grid; grid-template-columns: 0.86fr 1.14fr; gap: 40px; align-items: center; border: 1px solid #2a362e; }
    .mark { color: #55e878; font: 700 14px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { margin: 22px 0 0; font-size: 54px; line-height: 1.02; letter-spacing: -0.04em; }
    h1 span { display: block; color: #a3b2a7; }
    .url { margin: 28px 0 0; color: #55e878; font: 18px/1.4 ui-monospace, Menlo, monospace; }
    .capture { overflow: hidden; height: 486px; border: 1px solid #2a362e; border-radius: 12px; background: #0c0e11; }
    .capture img { width: 100%; height: 100%; object-fit: cover; object-position: top left; }
  </style>
</head>
<body>
  <main>
    <div>
      <div class="mark">Arthur Loop</div>
      <h1>Install once.<span>Your agent runs the loop.</span></h1>
      <p class="url">arthurloop.com</p>
    </div>
    <div class="capture">
      <img src="web-console.png" alt="Arthur Loop web console" />
    </div>
  </main>
</body>
</html>
