<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="Arthur Loop — a file-first control plane for AI dev loops">
  <title>Arthur Loop</title>
  <!-- card -->
  <rect x="1" y="1" width="1278" height="318" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- the loop glyph: advisor over executor around a state hub -->
  <g transform="translate(170,160)">
    <path d="M -70 0 A 70 70 0 0 1 70 0" fill="none" stroke="#58a6ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M 70 0 A 70 70 0 0 1 -70 0" fill="none" stroke="#3fb950" stroke-width="5" stroke-linecap="round"/>
    <polygon points="62,6 78,6 70,24" fill="#58a6ff"/>
    <polygon points="-62,-6 -78,-6 -70,-24" fill="#3fb950"/>
    <circle r="27" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">state</text>
    <text x="0" y="-92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#58a6ff">ADVISOR</text>
    <text x="0" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#3fb950">EXECUTOR</text>
  </g>

  <!-- wordmark -->
  <text x="745" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="8" fill="#e6edf3">ARTHUR LOOP</text>
  <text x="745" y="204" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#8b949e">A file-first control plane for AI dev loops</text>
  <text x="745" y="238" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" letter-spacing="1" fill="#6e7681">bring your own advisor &#183; executor &#183; tracker</text>
</svg>
