name: ci

on:
  push:
    branches: [main, testing, dev]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v

  arthurbar:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: menubar/ArthurBar
